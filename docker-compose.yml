  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command:
  #     bash -c "stac-api-load-testing --help"
    # volumes:
    #   - ./log-files:/app

  app-pgstac:
    container_name: stac-fastapi-pgstac
    image: stac-utils/stac-fastapi
    restart: always
    build:
      context: .
      dockerfile: backends/Dockerfile.pgstac
    environment:
      - ENVIRONMENT=local
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
      - PGHOST=pgstac
      - PGPORT=5432
      - WEB_CONCURRENCY=10
      - ENABLE_TRANSACTIONS_EXTENSIONS=true
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=1
    ports:
      - "8083:8082"
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      pgstac:
        condition: service_healthy
    command: ["uvicorn", "stac_fastapi.pgstac.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8082"]

  pgstac:
    container_name: pgstac
    image: ghcr.io/stac-utils/pgstac:v0.10.0
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgis
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
    ports:
      - "5439:5432"
    command: postgres -N 500 -c shared_buffers=2GB -c effective_cache_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgis", "-U", "username"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  app-elasticsearch:
    container_name: stac-fastapi-es
    image: ghcr.io/stac-utils/stac-fastapi-es:v8.1.1
    restart: always
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - ENVIRONMENT=local
      - WEB_CONCURRENCY=10
      - BACKEND=elasticsearch
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USE_SSL=false
      - ES_VERIFY_CERTS=false
      - ES_TIMEOUT=30
      - DATABASE_REFRESH=true
    ports:
      - "8084:8080"
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - elasticsearch
    command:
      bash -c "bash ./scripts/wait-for-it.sh elasticsearch:9200 -t 60 -- python -m stac_fastapi.elasticsearch.app"

  elasticsearch:
    container_name: es-container
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.3.2}
    hostname: elasticsearch
    environment:
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      bootstrap.memory_lock: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch/snapshots:/usr/share/elasticsearch/snapshots
    ports:
      - "9200:9200"

  app-opensearch:
    container_name: stac-fastapi-os
    image: ghcr.io/stac-utils/stac-fastapi-os:v8.1.1
    restart: always
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8082
      - ENVIRONMENT=local
      - WEB_CONCURRENCY=10
      - BACKEND=opensearch
      - ES_HOST=opensearch
      - ES_PORT=9202
      - ES_USE_SSL=false
      - ES_VERIFY_CERTS=false
      - ES_TIMEOUT=30
      - DATABASE_REFRESH=true
    ports:
      - "8085:8082"
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - opensearch
    command:
      bash -c "bash ./scripts/wait-for-it.sh opensearch:9202 -t 60 -- python -m stac_fastapi.opensearch.app"

  opensearch:
    container_name: os-container
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.8.0}
    hostname: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - ./opensearch/snapshots:/usr/share/opensearch/snapshots
    ports:
      - "9202:9202"

  app-mongo:
    container_name: stac-fastapi-mongo
    image: stac-utils/stac-fastapi-mongo
    restart: always
    build:
      context: .
      dockerfile: backends/Dockerfile.mongo
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8084
      - ENVIRONMENT=local
      - BACKEND=mongo
      - MONGO_DB=stac
      - MONGO_HOST=mongo
      - MONGO_USER=root
      - MONGO_PASS=example
      - MONGO_PORT=27017
    ports:
      - "8086:8084"
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      - mongo
    command:
      bash -c "bash ./scripts/wait-for-it.sh mongo:27017 -t 60 -- python -m stac_fastapi.mongo.app"

  mongo:
    container_name: mongo-container
    image: mongo:7.0
    hostname: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    ports:
      - "27017:27017"
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]

  app-stac-os-rs:
    container_name: stac-os-rs
    image: ghcr.io/jonhealy1/stac-os-rs:0.2.0
    restart: always
    environment:
      - OPENSEARCH_URL=http://opensearch-rs:9200
      - ENABLE_TRANSACTIONS_EXTENSIONS=true
      - ENABLE_COLLECTIONS_SEARCH_ROUTE=true
    ports:
      - "8087:3000"
    depends_on:
      opensearch-rs:
        condition: service_healthy

  opensearch-rs:
    container_name: stac-os-rs-opensearch
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.8.0}
    hostname: opensearch-rs
    environment:
      - cluster.name=stac-os-rs-cluster
      - node.name=osrs-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9203:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
